<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Omingle – Meet New People Instantly</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  background: #0e0e0e;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
}

body.modal-open {
  overflow: hidden;
}

.container {
  max-width: 520px;
  margin: 120px auto 40px;
  padding: 0 15px;
}

h1 {
  font-size: 44px;
  color: #ff0055;
}

.tagline {
  font-size: 18px;
  opacity: 0.9;
  margin-bottom: 20px;
}

.cta button {
  background: #ff0055;
  color: white;
  border: none;
  padding: 14px 26px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  margin: 10px 0;
}

.cta button.secondary {
  background: #2a2a2a;
}

/* ===== PREMIUM MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal-content {
  background: #111;
  padding: 25px;
  width: 90%;
  max-width: 420px;
  border-radius: 14px;
  text-align: left;
  box-shadow: 0 0 40px rgba(255,0,85,0.4);
  animation: popIn 0.25s ease;
}

.modal-content h2 {
  color: #ff0055;
  margin-top: 0;
}

.modal-content button {
  width: 100%;
  margin-top: 15px;
  background: #ff0055;
  color: #fff;
  border: none;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
}

.modal-content button.secondary {
  background: #444;
}

.shake {
  animation: shake 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="container">
  <h1>Omingle</h1>
  <div class="tagline">
    A fun place to meet strangers & talk freely
  </div>

  <div class="cta">
    <button onclick="startFlow('video')">Start Video Chat</button>
    <button class="secondary" onclick="startFlow('text')">Start Text Chat</button>
  </div>
</div>

<!-- TERMS FLOW MODAL -->
<div id="flowModal" class="modal" onclick="outsideClick(event, 'flowModal')">
  <div class="modal-content" id="flowBox">
    <h2>Before You Continue</h2>
    <label>
      <input type="checkbox" id="agreeAll" />
      I have read and agree to the Terms, Privacy Policy & Community Guidelines
    </label>
    <button onclick="verifyAge()">Continue</button>
  </div>
</div>

<!-- AGE MODAL -->
<div id="ageModal" class="modal" onclick="outsideClick(event, 'ageModal')">
  <div class="modal-content">
    <h2>Age Verification</h2>
    <p>This platform is strictly for users aged 18 or older.</p>
    <button onclick="enterChat()">I am 18 or older</button>
    <button class="secondary" onclick="denyAge()">I am under 18</button>
  </div>
</div>

<script>
let selectedMode = "video";

function showModal(id) {
  document.getElementById(id).style.display = "flex";
  document.body.classList.add("modal-open");
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
  document.body.classList.remove("modal-open");
}

function outsideClick(event, id) {
  if (event.target.id === id) {
    closeModal(id);
  }
}

function startFlow(mode) {
  selectedMode = mode;
  showModal("flowModal");
}

function verifyAge() {
  const checkbox = document.getElementById("agreeAll");
  const box = document.getElementById("flowBox");

  if (!checkbox.checked) {
    box.classList.add("shake");
    setTimeout(() => box.classList.remove("shake"), 300);
    return;
  }

  closeModal("flowModal");
  showModal("ageModal");
}

function enterChat() {
  window.location.href = "chat.html?mode=" + encodeURIComponent(selectedMode);
}

function denyAge() {
  alert("You must be 18+ to use Omingle");
  location.reload();
}
</script>

</body>
</html>
