<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Omingle – Video Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111, #1a0010);
  color: white;
  overflow: hidden;
}

/* ===== TOP HEADER ===== */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
  color: #ff0055;
  z-index: 1000;
}

.online-top {
  position: absolute;
  right: 15px;
  font-size: 14px;
  color: #00ffcc;
}

/* ===== VIDEO SECTION ===== */
.videos {
  display: flex;
  height: calc(100vh - 140px);
  margin-top: 60px;
  gap: 15px;
  padding: 15px;
  box-sizing: border-box;
}

/* Desktop = Left & Right */
.videos {
  flex-direction: row;
}

video {
  flex: 1;
  border-radius: 18px;
  object-fit: cover;
  background: black;
  border: 2px solid #ff0055;
  box-shadow: 0 0 25px rgba(255,0,85,0.6);
  transition: 0.3s;
}

/* Mobile = Up & Down */
@media (max-width: 768px) {
  .videos {
    flex-direction: column;
  }

  video {
    height: 50%;
  }
}

/* ===== CHAT SECTION ===== */
#messages {
  position: fixed;
  bottom: 120px;
  left: 10px;
  width: 95%;
  margin: 10px auto;
  max-height: 120px;
  overflow-y: auto;
  font-size: 14px;
}

/* ===== CONTROLS ===== */
.controls {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
}

.controls input {
  width: 60%;
  padding: 8px;
  border-radius: 5px;
  border: none;
}

.controls button {
  padding: 8px 10px;
  margin: 4px;
  border: none;
  border-radius: 5px;
  background: #ff0055;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">
  Omingle
</div>

<!-- VIDEO AREA -->
<div class="videos">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay muted playsinline></video>
</div>
  

<!-- CHAT -->
<div id="messages"></div>

<div class="controls">
  <input id="text" placeholder="Type message…" />
  <br />
  <button onclick="send()">Send</button>
  <button onclick="toggleMic()">Mic</button>
  <button onclick="toggleCam()">Cam</button>
  <button onclick="report()">Report</button>
  <button onclick="next()">Next</button>
</div>

<!-- SOCKET.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<!-- YOUR WEBRTC LOGIC -->
<script src="app.js"></script>

</body>
</html>
