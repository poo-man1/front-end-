<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Omingle · Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; background:#0e0e0e; color:#fff; font-family:Arial, sans-serif; }
    header { padding:10px 14px; border-bottom:1px solid #1f1f1f; display:flex; gap:8px; align-items:center; }
    main { padding:12px; display:grid; grid-template-columns: 2fr 1fr; gap:12px; }
    .videos { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    video { width:100%; background:#000; border-radius:10px; height:52vh; object-fit:cover; }
    .panel { background:#121212; border:1px solid #222; border-radius:10px; padding:10px; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    button { background:#ff0055; color:#fff; border:none; padding:10px 12px; border-radius:8px; cursor:pointer; }
    button.secondary { background:#2a2a2a; }
    #messages { height:40vh; overflow:auto; background:#0f0f0f; border:1px solid #222; padding:8px; border-radius:8px; }
    #text { width:100%; padding:8px; border-radius:6px; border:1px solid #333; background:#1a1a1a; color:#fff; }
    small.muted { opacity:.7; }
  </style>
</head>
<body>
  <header>
    <strong>Omingle</strong>
    <small class="muted" id="modeInfo"></small>
  </header>

  <main>
    <section class="panel">
      <div class="videos">
        <!-- Remote shows ONLY the other person -->
        <video id="remote" autoplay playsinline></video>
        <!-- Local preview is muted -->
        <video id="local" autoplay playsinline muted></video>
      </div>

      <div class="controls">
        <input id="text" placeholder="Type a message…"/>
        <button onclick="send()">Send</button>
        <button class="secondary" onclick="toggleMic()">Mic</button>
        <button class="secondary" onclick="toggleCam()">Cam</button>
        <button class="secondary" onclick="report()">Report</button>
        <button onclick="next()">Next</button>
      </div>
      <small class="muted">Tip: If you can see your local preview but not the other person, wait a few seconds for ICE or click “Next”.</small>
    </section>

    <aside class="panel">
      <h3>Chat</h3>
      <div id="messages"></div>
    </aside>
  </main>

  <!-- IMPORTANT: Load Socket.IO client from your signaling server origin -->
  <script src="https://gaaji-server.onrender.com/socket.io/socket.io.js"></script>
  <!-- Your app logic -->
  <script src="app.js"></script>
  <script>
    // Show chosen mode from landing page (optional)
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'video';
    document.getElementById('modeInfo').textContent = `· Mode: ${mode}`;
  </script>
</body>
</html>
