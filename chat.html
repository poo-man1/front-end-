<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omingle – Video Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
   
    /* Full-viewport flexible layout for the call area */
.call-wrap {
<style>
  body {
    margin: 0;
    background: #0e0e0e;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* Header Title */
  .brand {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #ff0055;
    z-index: 1000;
    letter-spacing: 1px;
  }

  /* Video Layout */
  .videos {
    display: flex;
    height: 100vh;
    width: 100%;
    padding-top: 60px;
    box-sizing: border-box;
    gap: 10px;
  }

  /* Desktop = Side by Side */
  .videos {
    flex-direction: row;
  }

  video {
    flex: 1;
    background: black;
    object-fit: cover;
    border-radius: 15px;
    border: 2px solid #ff0055;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
  }

  /* Mobile = Up & Down */
  @media (max-width: 768px) {
    .videos {
      flex-direction: column;
      padding: 70px 10px 10px;
    }

    video {
      height: 50%;
    }
  }

  .controls {
    position: fixed;
    bottom: 10px;
    left: 0;
    width: 100%;
    text-align: center;
  }

  .controls input {
    width: 60%;
    padding: 8px;
    border-radius: 5px;
    border: none;
  }

  .controls button {
    padding: 8px 10px;
    margin: 4px;
    border: none;
    border-radius: 5px;
    background: #ff0055;
    color: white;
    cursor: pointer;
  }

  #messages {
    position: fixed;
    bottom: 70px;
    left: 10px;
    max-height: 120px;
    width: 90%;
    overflow-y: auto;
    font-size: 14px;
  }
</style>
</head>

<body>

  <!-- VIDEO AREA -->
  <div class="videos">
    <!-- Stranger video -->
    <video id="remote" autoplay playsinline></video>

    <!-- Your video (MUTED to avoid echo) -->
    <video id="local" autoplay muted playsinline></video>
  </div>

  <!-- CHAT + CONTROLS -->
  <div id="messages"></div>

  <div class="controls">
    <input id="text" placeholder="Type message…" />
    <br />
    <button onclick="send()">Send</button>
    <button onclick="toggleMic()">Mic</button>
    <button onclick="toggleCam()">Cam</button>
    <button onclick="report()">Report</button>
    <button onclick="next()">Next</button>
  </div>

  <!-- SOCKET.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- YOUR WEBRTC LOGIC -->
  <script src="app.js"></script>

</body>
</html>
