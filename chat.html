<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omingle – Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root { --bg:#0e0e0e; --panel:#141414; --primary:#ff0055; --muted:#bdbdbd; }
    body { margin:0; background:var(--bg); color:#fff; font-family:Arial, Helvetica, sans-serif; height:100dvh; display:flex; flex-direction:column; }

    header { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; background:#101010; border-bottom:1px solid #1f1f1f; }
    header .brand { color:var(--primary); font-weight:700; letter-spacing:0.3px; }
    header .status { color:var(--muted); font-size:13px; }

    .wrapper { flex:1; display:grid; grid-template-columns:1fr; grid-template-rows:1fr auto; gap:10px; padding:10px; max-width:1100px; margin:0 auto; width:100%; }

    .videos {
      background:var(--panel); border:1px solid #242424; border-radius:12px; padding:10px;
      display:grid; gap:10px;
      /* MOBILE: stacked */
      grid-template-rows: 1fr 220px; grid-template-columns:1fr;
    }

    .video-box { position:relative; background:#000; border-radius:10px; overflow:hidden; }
    video { width:100%; height:100%; object-fit:cover; background:#000; display:block; }
    .label { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:6px; font-size:12px; border:1px solid rgba(255,255,255,0.12); }

    .controls {
      background:var(--panel); border:1px solid #242424; border-radius:12px; padding:10px;
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
    }
    .btn { background:#222; color:#fff; border:1px solid #333; padding:10px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
    .btn.primary { background:var(--primary); border-color:#ff2a71; }
    .btn:hover { opacity:0.92; }

    /* DESKTOP: side-by-side */
    @media (min-width: 769px) {
      .videos { grid-template-columns: 2fr 1.2fr; grid-template-rows:1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">Omingle</div>
  <div class="status" id="modeStatus">Connecting…</div>
</header>

<main class="wrapper" role="main">
  <section class="videos" aria-label="Video chat area">
    <!-- Receiver (remote) -->
    <div class="video-box" id="remoteBox">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Receiver</div>
    </div>
    <!-- You (local) -->
    <div class="video-box" id="localBox">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">You</div>
    </div>
  </section>

  <section class="controls" aria-label="Call controls">
    <button class="btn" id="muteBtn">Mute</button>
    <button class="btn" id="camBtn">Camera Off</button>
    <button class="btn" id="nextBtn">Next</button>
    <button class="btn primary" id="endBtn">End</button>
  </section>
</main>

<script>
  // Read mode from query (?mode=video|text)
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'video';
  const modeStatus = document.getElementById('modeStatus');
  modeStatus.textContent = mode === 'text' ? 'Text Chat' : 'Video Chat';

  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');

  let localStream;
  let micEnabled = true;
  let camEnabled = true;

  // Peer connections for loopback demo
  let pc1, pc2;

  async function initLocal() {
    if (mode !== 'video') return;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: true
      });
      localVideo.srcObject = localStream;

      // Start loopback so "Receiver" displays for testing
      await startLoopback(localStream);
    } catch (err) {
      console.error('Camera/Mic error:', err);
      modeStatus.textContent = 'Permissions needed for camera/mic';
      alert('Please allow camera and microphone to start the video chat.');
    }
  }

  async function startLoopback(stream) {
    const iceConfig = { iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] };

    pc1 = new RTCPeerConnection(iceConfig);
    pc2 = new RTCPeerConnection(iceConfig);

    stream.getTracks().forEach(t => pc1.addTrack(t, stream));

    pc2.ontrack = (ev) => {
      const [remoteStream] = ev.streams;
      remoteVideo.srcObject = remoteStream;
    };

    pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate).catch(console.error);
    pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate).catch(console.error);

    const offer = await pc1.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
    await pc1.setLocalDescription(offer);
    await pc2.setRemoteDescription(offer);

    const answer = await pc2.createAnswer();
    await pc2.setLocalDescription(answer);
    await pc1.setRemoteDescription(answer);

    modeStatus.textContent = 'Connected (demo loopback)';
  }

  // Controls
  document.getElementById('muteBtn').addEventListener('click', () => {
    if (!localStream) return;
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    document.getElementById('muteBtn').textContent = micEnabled ? 'Mute' : 'Unmute';
  });

  document.getElementById('camBtn').addEventListener('click', () => {
    if (!localStream) return;
    camEnabled = !camEnabled;
    localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
    document.getElementById('camBtn').textContent = camEnabled ? 'Camera Off' : 'Camera On';
  });

  document.getElementById('endBtn').addEventListener('click', () => {
    cleanup();
    window.location.href = 'index.html';
  });

  document.getElementById('nextBtn').addEventListener('click', async () => {
    modeStatus.textContent = 'Finding next match...';
    await cleanupPeerConnections();
    await startLoopback(localStream);
    modeStatus.textContent = 'Connected (demo loopback)';
  });

  function cleanupPeerConnections() {
    try { pc1 && pc1.close(); } catch {}
    try { pc2 && pc2.close(); } catch {}
    pc1 = pc2 = null;
  }

  function cleanup() {
    cleanupPeerConnections();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localVideo.srcObject = null;
    remoteVideo.srcObject = null;
  }

  window.addEventListener('beforeunload', cleanup);

  // Kick off
  initLocal();
</script>

</body>
</html>
