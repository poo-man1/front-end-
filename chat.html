<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Omingle – Video Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== TOPBAR ===== */
.topbar {
  height: 52px;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  color: #ffffff;
  flex-shrink: 0;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  letter-spacing: 1px;
}

.online-badge {
  position: absolute;
  right: 14px;
  font-size: 12px;
  color: #cccccc;
  display: flex;
  align-items: center;
  gap: 5px;
}

.online-dot {
  width: 8px; height: 8px;
  background: #ffffff;
  border-radius: 50%;
}

/* ===== STATUS BAR ===== */
#statusBar {
  text-align: center;
  font-size: 12px;
  padding: 4px 8px;
  background: rgba(255,255,255,0.1);
  color: #e5e5e5;
  flex-shrink: 0;
  display: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

/* ===== VIDEO SECTION ===== */
.video-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  min-height: 0;
}

.video-wrapper {
  flex: 1;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: #111;
  border: 2px solid rgba(255,255,255,0.4);
  min-height: 0;
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.video-label {
  position: absolute;
  bottom: 8px;
  left: 10px;
  font-size: 11px;
  font-weight: 600;
  color: white;
  background: rgba(0,0,0,0.6);
  padding: 3px 8px;
  border-radius: 20px;
}

/* Desktop: side by side */
@media (min-width: 769px) {
  .video-section {
    flex-direction: row;
    padding: 10px;
    gap: 10px;
  }
}

/* ===== CHAT SECTION ===== */
.chat-section {
  flex-shrink: 0;
  background: rgba(10,10,10,0.95);
  border-top: 1px solid rgba(255,255,255,0.3);
  display: flex;
  flex-direction: column;
  max-height: 220px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 13px;
  max-height: 100px;
  min-height: 40px;
}

#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }

#messages div {
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  line-height: 1.4;
}

#messages div b { color: #e5e5e5; }

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: rgba(0,0,0,0.8);
  border-top: 1px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}

.controls input {
  flex: 1;
  padding: 9px 14px;
  border-radius: 25px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.07);
  color: white;
  font-size: 13px;
  outline: none;
  min-width: 0;
}

.controls input::placeholder { color: #888; }
.controls input:focus { border-color: #ffffff; }

.ctrl-btn {
  padding: 9px 12px;
  border: none;
  border-radius: 22px;
  background: #ffffff;
  color: #0a0a0a;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: 0.2s;
  flex-shrink: 0;
}

.ctrl-btn:hover { background: #dddddd; transform: scale(1.04); }
.ctrl-btn.gray  { background: #2d2d2d; color: white; }
.ctrl-btn.gray:hover { background: #4a4a4a; }
.ctrl-btn.next  { background: linear-gradient(105deg, #ffffff, #b3b3b3); color: #0a0a0a; }

/* Hide text on very small screens, show icons only */
@media (max-width: 400px) {
  .btn-text { display: none; }
  .ctrl-btn { padding: 9px 10px; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  Omingle
  <div class="online-badge">
    <div class="online-dot"></div>
    <span id="onlineUsers">0</span> online
  </div>
</div>

<!-- STATUS -->
<div id="statusBar"></div>

<!-- VIDEOS -->
<div class="video-section">
  <div class="video-wrapper">
    <video id="remote" autoplay playsinline></video>
    <div class="video-label">Stranger</div>
  </div>
  <div class="video-wrapper">
    <video id="local" autoplay muted playsinline></video>
    <div class="video-label">You</div>
  </div>
</div>

<!-- CHAT MESSAGES -->
<div class="chat-section">
  <div id="messages"></div>

  <!-- CONTROLS -->
  <div class="controls">
    <input id="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()" />
    <button class="ctrl-btn" onclick="send()"><i class="fas fa-paper-plane"></i> <span class="btn-text">Send</span></button>
    <button class="ctrl-btn gray" onclick="toggleMic()" id="micBtn"><i class="fas fa-microphone"></i></button>
    <button class="ctrl-btn gray" onclick="toggleCam()" id="camBtn"><i class="fas fa-video"></i></button>
    <button class="ctrl-btn gray" onclick="report()"><i class="fas fa-flag"></i></button>
    <button class="ctrl-btn next" onclick="next()"><i class="fas fa-forward"></i> <span class="btn-text">Next</span></button>
  </div>
</div>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<!-- WebRTC logic -->
<script src="app.js"></script>

<script>
  // Online count
  socket.on("onlineCount", (count) => {
    const el = document.getElementById("onlineUsers");
    if (el) el.innerText = count;
  });

  // Status bar
  const statusBar = document.getElementById("statusBar");
  const _orig = window.showStatus;
  window.showStatus = function(text) {
    statusBar.textContent = text;
    statusBar.style.display = "block";
    clearTimeout(statusBar._t);
    statusBar._t = setTimeout(() => statusBar.style.display = "none", 3000);
    if (_orig) _orig(text);
  };

  // Mic/cam icon toggle
  const micBtn = document.getElementById("micBtn");
  const camBtn = document.getElementById("camBtn");
  const _mic = window.toggleMic;
  const _cam = window.toggleCam;
  window.toggleMic = function() {
    _mic();
    const on = micBtn.querySelector("i").className.includes("slash");
    micBtn.querySelector("i").className = on ? "fas fa-microphone" : "fas fa-microphone-slash";
    micBtn.style.background = on ? "#2d2d2d" : "#4a4a4a";
  };
  window.toggleCam = function() {
    _cam();
    const on = camBtn.querySelector("i").className.includes("slash");
    camBtn.querySelector("i").className = on ? "fas fa-video" : "fas fa-video-slash";
    camBtn.style.background = on ? "#2d2d2d" : "#4a4a4a";
  };
</script>
</body>
</html>
