<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Omingle – Video Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
   
    /* Full-viewport flexible layout for the call area */
.call-wrap {
  display: grid;
  gap: 8px;
  height: 100vh;          /* occupy full screen during call */
  padding: 8px;
  background: #000;
}

/* Mobile / Tablet (stacked: receiver on top, caller bottom) */
@media (max-width: 991px) {
  .call-wrap {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
  }
  #remoteVideo { grid-row: 1; }
  #localVideo  { grid-row: 2; }
}

/* Laptop / Desktop (side-by-side: receiver left, caller right) */
@media (min-width: 992px) {
  .call-wrap {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
  }
  #remoteVideo { grid-column: 1; }
  #localVideo  { grid-column: 2; }
}

/* Make videos fill their grid area nicely */
#remoteVideo, #localVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;   /* crop to fill */
  background: #111;
  border-radius: 8px;
}/* Full-viewport flexible layout for the call area */

}
  </style>
</head>

<body>

  <!-- VIDEO AREA -->
  <div class="videos">
    <!-- Stranger video -->
    <video id="remote" autoplay playsinline></video>

    <!-- Your video (MUTED to avoid echo) -->
    <video id="local" autoplay muted playsinline></video>
  </div>

  <!-- CHAT + CONTROLS -->
  <div id="messages"></div>

  <div class="controls">
    <input id="text" placeholder="Type message…" />
    <br />
    <button onclick="send()">Send</button>
    <button onclick="toggleMic()">Mic</button>
    <button onclick="toggleCam()">Cam</button>
    <button onclick="report()">Report</button>
    <button onclick="next()">Next</button>
  </div>

  <!-- SOCKET.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- YOUR WEBRTC LOGIC -->
  <script src="app.js"></script>

</body>
</html>
