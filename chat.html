<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Gomingle – Video Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#050507;--panel:#0c0b10;--panel2:#111017;--line:#292333;
  --text:#f7f5fb;--muted:#9691a3;--purple:#ff3f9b;--pink:#ff4f9f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button,input{font:inherit}
.topbar{
  height:48px;flex:0 0 48px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;
  background:#050507;border-bottom:1px solid #17151d
}
.brand{display:flex;align-items:center;gap:7px;font-size:27px;font-weight:800;letter-spacing:-1.2px}
.brand-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,#ff68b3,#d91e78);font-size:19px}
.brand-text{color:#f6f4f9}
.brand-text span{color:#ff9acb}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-pill,.online-pill{
  height:28px;border:1px solid #4a2438;border-radius:20px;background:#0e0c13;
  display:flex;align-items:center;justify-content:center;color:#e8c4d8
}
.icon-pill{width:38px;font-size:12px}
.online-pill{padding:0 11px;gap:6px;font-size:11px}
.online-pill strong{color:#ff8fc4;font-size:12px}
.online-dot{width:7px;height:7px;border-radius:50%;background:#43db83;box-shadow:0 0 8px #43db83}
#statusBar{display:none;flex:0 0 auto;text-align:center;padding:6px 10px;background:#30101f;color:#ffe0ef;font-size:12px}
.workspace{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,30.7%) minmax(0,1fr);
  gap:7px;padding:1px 7px 7px
}
.video-column{min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:7px}
.video-box{
  min-height:0;position:relative;overflow:hidden;border-radius:7px;background:#101014;
  border:1px solid #17151d
}
.video-box video{width:100%;height:100%;display:block;object-fit:cover;background:#101014}
#local{transform:scaleX(-1)}
.video-brand{
  position:absolute;left:11px;bottom:10px;z-index:2;display:flex;align-items:center;gap:5px;
  font-size:20px;font-weight:800;letter-spacing:-.8px;text-shadow:0 2px 8px #000
}
.video-brand .mini-icon{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,#ff68b3,#d91e78);font-size:12px}
.video-brand small{font-size:12px;color:#ffacd2;letter-spacing:0}
.video-tools{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;align-items:center;gap:12px;color:#aaa;font-size:12px}
.video-tools input{width:90px;accent-color:#aaa}
.video-tools button{border:0;background:transparent;color:#aaa;cursor:pointer}
.remote-label,.local-label{position:absolute;top:10px;left:11px;z-index:2;padding:5px 8px;
  border-radius:5px;background:#0008;color:#d7d2df;font-size:10px;letter-spacing:.2px}
.chat-side{
  min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;
  border:1px solid #17151d;border-radius:8px;background:#0b0a0d;overflow:hidden
}
.welcome{
  flex:0 0 auto;padding:15px 12px 8px;color:#f3f0f7;line-height:1.5;font-size:16px
}
.welcome h1{font-size:18px;font-weight:750;margin-bottom:3px;letter-spacing:-.3px}
.age-line{font-weight:700;color:#ff9acb;margin-bottom:2px}
.age-badge{display:inline-block;padding:1px 5px;margin-right:5px;border-radius:3px;
  background:#e31d55;color:#fff;font-size:11px;vertical-align:1px}
.rules{color:#e3dfe8}
.rules .ban{color:#9993a5;font-weight:700;margin-top:2px}
#messages{
  flex:1;min-height:0;overflow-y:auto;padding:12px;color:#e9e5ef;font-size:13px;line-height:1.5;
  scrollbar-width:thin;scrollbar-color:#a83270 transparent
}
#messages div{padding:4px 0;overflow-wrap:anywhere;border-bottom:1px solid #ffffff08}
#messages div b{color:#ff9acb}
.bottom-area{flex:0 0 auto;padding:0 0 0}
.utility-row{height:39px;display:flex;align-items:center;gap:7px;padding:0 10px}
.utility-btn{
  height:30px;padding:0 11px;border-radius:20px;border:1px solid #30283e;background:#0b0a10;
  color:#e7e1ef;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:7px;cursor:pointer
}
.utility-btn .globe{color:#ff9bc9}
.utility-btn.premium{background:linear-gradient(110deg,#ff5ba9,#e52d86);border-color:transparent;color:#fff}
.utility-btn.premium i{color:#ffe27a}
.composer{display:grid;grid-template-columns:88px minmax(0,1fr);gap:5px;padding:0 0 0}
.start-btn{
  min-height:58px;border:1px solid #54213d;border-radius:7px;background:#0d0a15;color:#fff;
  font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.start-btn small{font-size:10px;color:#a49bb2}
.message-form{min-width:0;display:flex;align-items:stretch;border:1px solid #54213d;border-radius:7px;background:#0a090d}
.message-form input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;font-size:13px}
.message-form input::placeholder{color:#817b8d}
.send-btn{width:46px;border:0;background:transparent;color:#858091;font-size:17px;cursor:pointer}
.send-btn:hover{color:#c1a0ff}
.mobile-controls{display:none}
@media(max-width:700px){
  body{overflow:hidden}
  .topbar{height:46px;flex-basis:46px}
  .brand{font-size:23px}
  .brand-icon{width:31px;height:31px}
  .workspace{grid-template-columns:1fr;grid-template-rows:minmax(190px,42%) minmax(0,1fr);gap:6px;padding:5px}
  .video-column{grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:6px}
  .video-brand{font-size:14px;left:7px;bottom:7px}
  .video-brand .mini-icon{width:19px;height:19px;font-size:10px}
  .video-brand small{font-size:9px}
  .video-tools{display:none}
  .welcome{padding:10px 11px 4px;font-size:13px;line-height:1.4}
  .welcome h1{font-size:16px}
  #messages{padding:8px 11px}
  .utility-row{height:35px;padding:0 7px}
  .composer{grid-template-columns:66px minmax(0,1fr)}
  .start-btn{min-height:49px;font-size:12px}
  .message-form input{padding:0 10px;font-size:12px}
  .send-btn{width:38px}
}
@media(max-width:380px){
  .welcome{font-size:12px}
  .utility-btn{padding:0 8px}
  .online-pill{font-size:10px;padding:0 8px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon"><i class="fa-regular fa-message"></i></span>
    <span class="brand-text">Gomingle</span>
  </div>
  <div class="header-actions">
    <button class="icon-pill" type="button" aria-label="Display settings" title="Display settings"><i class="fa-solid fa-sun"></i></button>
    <div class="online-pill"><span class="online-dot"></span><strong id="onlineUsers">0</strong> online</div>
  </div>
</header>
<div id="statusBar" role="status" aria-live="polite"></div>

<main class="workspace">
  <section class="video-column" aria-label="Video feeds">
    <div class="video-box">
      <span class="remote-label">STRANGER</span>
      <video id="remote" autoplay playsinline></video>
      <div class="video-brand"><span class="mini-icon"><i class="fa-regular fa-message"></i></span>gomingle<small>.com</small></div>
      <div class="video-tools"><input type="range" min="0" max="100" value="100" aria-label="Video volume"><button type="button" aria-label="Report video" onclick="report()"><i class="fa-regular fa-flag"></i></button></div>
    </div>
    <div class="video-box">
      <span class="local-label">YOU</span>
      <video id="local" autoplay muted playsinline></video>
      <div class="video-brand"><span class="mini-icon"><i class="fa-regular fa-message"></i></span>gomingle<small>.com</small></div>
    </div>
  </section>

  <section class="chat-side" aria-label="Chat panel">
    <div class="welcome">
      <h1>Welcome to Gomingle.</h1>
      <div class="age-line"><span class="age-badge">18+</span>You must be 18 or older</div>
      <div class="rules">
        <div>No nudity, hate speech, or harassment</div>
        <div>Your camera must show you, live</div>
        <div>Do not ask for gender — this is not a dating site</div>
        <div class="ban">Violators will be banned</div>
      </div>
    </div>
    <div id="messages" aria-live="polite"></div>
    <div class="bottom-area">
      <div class="utility-row">
      </div>
      <div class="composer">
        <button class="start-btn" type="button" onclick="next()"><span>Next</span><small>Skip</small></button>
        <div class="message-form">
          <input id="text" placeholder="Type a message..." autocomplete="off"
            onkeydown="if(event.key==='Enter'){event.preventDefault();send();}" aria-label="Type a message">
          <button class="send-btn" type="button" onclick="send()" aria-label="Send message"><i class="fa-solid fa-play"></i></button>
        </div>
      </div>
      <div class="mobile-controls">
        <button class="ctrl-btn" type="button" onclick="toggleMic()" id="micBtn"><i class="fa-solid fa-microphone"></i></button>
        <button class="ctrl-btn" type="button" onclick="toggleCam()" id="camBtn"><i class="fa-solid fa-video"></i></button>
        <button class="ctrl-btn" type="button" onclick="report()"><i class="fa-solid fa-flag"></i></button>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="app.js"></script>
<script>
  // Existing Socket.IO online counter.
  if (typeof socket !== "undefined" && socket) {
    socket.on("onlineCount", (count) => {
      const el = document.getElementById("onlineUsers");
      if (el) el.innerText = count;
    });
  }

  // Preserve existing status callback while showing status in the redesigned UI.
  const statusBar = document.getElementById("statusBar");
  const originalShowStatus = window.showStatus;
  window.showStatus = function(message) {
    statusBar.textContent = message;
    statusBar.style.display = "block";
    clearTimeout(statusBar._timer);
    statusBar._timer = setTimeout(() => statusBar.style.display = "none", 3000);
    if (typeof originalShowStatus === "function") originalShowStatus(message);
  };
</script>
</body>
</html>
